<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BANKBUGS|FX Terminal</title>
    <link rel="stylesheet" href="prev/style.css">
    <!-- Premium Vector Icon Set CDN -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- APP WRAPPER -->
    <div class="app-container">
        
        <!-- FIXED APP HEADER -->
        <header class="app-header">
            <div class="brand-block">
                <i data-lucide="terminal" class="gold-text"></i>
                <h1>BANKBUGS<span>FX</span></h1>
            </div>
            <div class="header-actions">
                <div class="user-profile-tag">
                    <i data-lucide="user"></i>
                    <span class="username-display">Loading...</span>
                </div>
                <button class="logout-btn" title="Sign Out">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT GRID -->
        <div class="main-layout">
            
            <!-- PERSISTENT SIDEBAR (DESKTOP) / SLIDING BOTTOM SHEET (MOBILE) -->
            <aside id="sideResourcesMenu" class="resources-drawer">
                <div class="drawer-header">
                    <h3><i data-lucide="folder-open"></i> Systems & Resources</h3>
                    <button id="closeDrawerBtn" class="mobile-only-btn">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                
                <nav class="drawer-nav">
                    <!-- Accordion Item 1 -->
                    <div class="accordion-group">
                        <div class="accordion-trigger" onclick="toggleSubNav(this)">
                            <span><i data-lucide="book-open"></i> Core Framework</span>
                            <i data-lucide="chevron-down" class="chevron"></i>
                        </div>
                        <div class="accordion-content">
                            <button onclick="loadContent('core-concepts')">Market Structure</button>
                            <button onclick="loadContent('orderflow')">Orderflow Mechanics</button>
                        </div>
                    </div>

                    <!-- Accordion Item 2 -->
                    <div class="accordion-group">
                        <div class="accordion-trigger" onclick="toggleSubNav(this)">
                            <span><i data-lucide="activity"></i> Advanced Tools</span>
                            <i data-lucide="chevron-down" class="chevron"></i>
                        </div>
                        <div class="accordion-content">
                            <button onclick="loadContent('liquidity-engine')">Liquidity Engine v4.1</button>
                            <button onclick="loadContent('indicators')">Indicators & Profiles</button>
                        </div>
                    </div>
                </nav>
            </aside>

            <!-- SCROLLABLE CORE VIEWPORT LAYER -->
            <main class="viewport-canvas">
                <div id="workspace-dynamic-canvas" class="scroll-container">
                    <!-- Dynamic modules inject content right here -->
                </div>
            </main>

        </div>

        <!-- MOBILE-APP BOTTOM NAVIGATION DOCK -->
        <nav class="app-bottom-dock">
            <button class="dock-action-btn active" onclick="handleDockPress(this, 'market')">
                <i data-lucide="candlestick-chart"></i>
                <span>Market</span>
            </button>
            <button class="dock-action-btn" onclick="handleDockPress(this, 'strategy')">
                <i data-lucide="shield-alert"></i>
                <span>Strategy</span>
            </button>
            <button id="mobileResourcesBtn" class="dock-action-btn">
                <i data-lucide="layout-grid"></i>
                <span>Menu</span>
            </button>
        </nav>

    </div>
<script src="prev/dashboard.js"></script>
</body>
</html>
