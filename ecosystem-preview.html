<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS|FX Dashboard</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Dashboard Core & Component Stylesheets -->
    <link rel="stylesheet" href="prev/dashboardlayout.css">
    <link rel="stylesheet" href="prev/premiumnavbuttons.css">
    
</head>
<body>

    <!-- Two-Tier Top Navigation (Locked & Flexed) -->
    <header class="top-nav">
        
        <div class="tier-one">
            <div class="nav-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span class="brand-name">BANKBUGS<span class="gold-glow-text">|FX</span></span>
            </div>
            
            <div class="tier-one-actions">
                <div class="live-node-pill">
                    <span class="pulse-dot"></span>
                    <span class="node-count"><span class="dynamic-counter">51</span> online</span>
                </div>
                <div class="user-profile-tag">
                    <span class="username-display">Members Area</span>
                </div>
                <button class="logout-btn-interactive" onclick="window.location.replace('login.html')">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    <span class="btn-text">Logout</span>
                </button>
            </div>
        </div>

        <!-- Tier Two: Utility Controls -->
        <!-- Tier Two: Utility Controls -->
<div class="tier-two">
    <button class="menu-toggle-btn" id="sidebarToggle" aria-label="Toggle Side Resources Menu">
        <span>Dashboard</span>
    </button>
            <div class="tier-two-dropdowns">
                <button class="tier-two-btn" onclick="toggleMainDisplay('core-concepts-panel')">Core Concepts</button>
                <button class="tier-two-btn" onclick="toggleMainDisplay('indicators-panel')">Tools/Indicators</button>
            </div>
        </div>
    </header>

    <!-- Master App Layout Container -->
    <div class="app-layout-wrapper">
        
      <!-- Collapsible Side Resources Menu Grid -->
        <aside class="side-resources-drawer" id="sideResourcesMenu">
            <nav class="drawer-nav-tree">
                
                <!-- 1. Strategy -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 2 18 2 18 6 6 6 6 2"/><rect width="14" height="14" x="5" y="6" rx="2"/><path d="M9 11h6"/><path d="M9 15h6"/></svg>
                            Strategy
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('strategy-playbook')">Playbook</button>
                        <button class="subnav-action-btn" onclick="loadContent('strategy-setups')">Setups</button>
                        <button class="subnav-action-btn" onclick="loadContent('strategy-checklists')">Checklists</button>
                    </div>
                </div>

                <!-- 2. Analysis -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            Analysis
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('analysis-market-framework')">Market Framework</button>
                        <button class="subnav-action-btn" onclick="loadContent('analysis-liquidity')">Liquidity</button>
                        <button class="subnav-action-btn" onclick="loadContent('analysis-examples')">Examples</button>
                    </div>
                </div>

                <!-- 3. Risk Control -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            Risk Control
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('risk-framework')">Risk Framework</button>
                        <button class="subnav-action-btn" onclick="loadContent('risk-position-sizing')">Position Sizing</button>
                        <button class="subnav-action-btn" onclick="loadContent('risk-rules')">Rules</button>
                    </div>
                </div>

                <!-- 4. Execution -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                            Execution
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('execution-trading-bots')">Trading Bots</button>
                        <button class="subnav-action-btn" onclick="loadContent('execution-indicators')">Indicators</button>
                        <button class="subnav-action-btn" onclick="loadContent('execution-models')">Execution Models</button>
                    </div>
                </div>

                <!-- 5. Education -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
                            Education
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('education-courses')">Courses</button>
                        <button class="subnav-action-btn" onclick="loadContent('education-videos')">Videos</button>
                        <button class="subnav-action-btn" onclick="loadContent('education-lessons')">Lessons</button>
                    </div>
                </div>

                <!-- 6. Research -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            Research
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="accordion-content">
                        <button class="subnav-action-btn" onclick="loadContent('research-backtests')">Backtests</button>
                        <button class="subnav-action-btn" onclick="loadContent('research-case-studies')">Case Studies</button>
                        <button class="subnav-action-btn" onclick="loadContent('research-data-library')">Data Library</button>
                    </div>
                </div>

                <!-- 7. Journal (Single-tier Accordion Item for consistent styling architecture) -->
                <div class="accordion-item">
                    <button class="accordion-trigger standalone-style" onclick="loadContent('trading-journal')">
                        <span class="trigger-label">
                            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            Journal
                        </span>
                    </button>
                </div>

                <!-- Standalone Nav Item 9 (Preserved) -->
                <button class="standalone-nav-btn" onclick="loadContent('community-panel')">
                    <span>
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Our Community
                    </span>
                </button>

                <!-- Standalone Nav Item 10 (Preserved) -->
                <button class="standalone-nav-btn" onclick="loadContent('signals-panel')">
                    <span>
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        Free Signal Group
                    </span>
                </button>

                              <!-- Premium CTA Nav Item 11 -->
                <button class="premium-cta-btn" onclick="loadContent('billing-gateway')">
                    <span class="premium-text-glow">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        Unlock Full Features
                    </span>
                </button>

            </nav>
        </aside>


        <!-- Main Display Content Workspace Window -->
        <main class="dashboard-workspace-viewport">
            <div id="workspace-dynamic-canvas" class="viewport-canvas">
                <!-- Fallback/Default Content Display Area -->
                <div class="empty-state-card">
                    <h2>Welcome to the Terminal Console</h2>
                    <p>Select an operation parameter or load a structural resource sub-navigation node to begin processing live market tracking data.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Dock Navigation Bar -->
    <nav class="bottom-dock-nav">
        <button class="dock-action-btn active" onclick="handleDockPress(this, 'strategy')">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span class="dock-label">Strategy</span>
        </button>
        <button class="dock-action-btn" onclick="handleDockPress(this, 'market')">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span class="dock-label">Market Analysis</span>
        </button>
        <button class="dock-action-btn" onclick="handleDockPress(this, 'live')">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="dock-label">Live Execution</span>
        </button>
        <button class="dock-action-btn" onclick="handleDockPress(this, 'review')">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span class="dock-label">Trade Review</span>
        </button>
        <button class="dock-action-btn" onclick="handleDockPress(this, 'case')">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            <span class="dock-label">Case Study</span>
        </button>
    </nav>

      <script src="prev/dashboard.js"></script>
    <script src="prev/applayout.js"></script>
</body>
</html>
