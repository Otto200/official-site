<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BANKBUGS|FX Dashboard</title>
    <!-- Lucide Icons for clean vector iconography -->
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="prev/style.css">
</head>
<body>

    <!-- ─── TOP TIER HEADERS ─── -->
    <header class="top-bar">
        <div class="brand">
            <i data-lucide="trending-up" class="brand-icon"></i>
            <h1>BANKBUGS<span>|FX</span></h1>
        </div>
        
        <!-- PERMANENTLY VISIBLE TOP NAV LINKS ON ALL SCREEN CONFIGURATIONS -->
        <div class="top-nav-links">
            <button class="nav-tab active" onclick="toggleMainDisplay('core-concepts')">
                <i data-lucide="terminal"></i> <span class="tab-label">Core Concepts</span>
            </button>
            <button class="nav-tab" onclick="toggleMainDisplay('indicators')">
                <i data-lucide="layers"></i> <span class="tab-label">Systems & Tools</span>
            </button>
            <button id="sidebarToggle" class="nav-tab utility-btn">
                <i data-lucide="folder-open"></i> <span class="tab-label">Resources</span>
            </button>
        </div>

        <div class="user-actions">
            <div class="user-profile">
                <i data-lucide="user" class="user-icon"></i>
                <span class="username-display">Loading Session...</span>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Secure Log Out">
                <i data-lucide="log-out"></i>
            </button>
        </div>
    </header>

    <!-- ─── MAIN VIEWPORT WRAPPER ─── -->
    <div class="dashboard-container">
        
        <!-- SIDE RESOURCES DRAWER -->
        <aside id="sideResourcesMenu" class="side-drawer">
            <div class="drawer-header">
                <h3><i data-lucide="database"></i> Resource Node</h3>
            </div>
            
            <nav class="drawer-nav">
                <!-- Accordion Item 1 -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span><i data-lucide="book-open"></i> Market Frameworks</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div class="accordion-content">
                        <button onclick="loadContent('structure-masterclass')">Orderflow Dynamics</button>
                        <button onclick="loadContent('liquidity-cycles')">Liquidity Clearing</button>
                    </div>
                </div>

                <!-- Accordion Item 2 -->
                <div class="accordion-item">
                    <button class="accordion-trigger" onclick="toggleSubNav(this)">
                        <span><i data-lucide="cpu"></i> Proprietary Tools</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div class="accordion-content">
                        <button onclick="loadContent('engine-v4')">Liquidity Engine v4.1</button>
                        <button onclick="loadContent('volume-profiles')">Volume Matrix Docs</button>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- DYNAMIC WORKSPACE CANVAS -->
        <main class="workspace">
            <div id="workspace-dynamic-canvas" class="canvas-layer">
                <!-- Initial Core Landing State -->
                <div class="content-card active-state">
                    <h2><i data-lucide="shield-check"></i> System Initialized</h2>
                    <hr>
                    <p>Select a structural framework module from the top navigation panel or open the resources node drawer to securely stream core data streams into this terminal view.</p>
                </div>
            </div>
        </main>

    </div>

    <!-- ─── INTERACTION INTERFACE FOOTER DOCK (PERMANENTLY VISIBLE) ─── -->
    <footer class="bottom-dock">
        <button class="dock-btn active" onclick="handleDockPress(this, 'strategy')">
            <i data-lucide="activity"></i>
            <span>Strategy Matrix</span>
        </button>
        <button class="dock-btn" onclick="handleDockPress(this, 'market-bias')">
            <i data-lucide="globe"></i>
            <span>Market Bias</span>
        </button>
        <button class="dock-btn" onclick="handleDockPress(this, 'risk-calc')">
            <i data-lucide="calculator"></i>
            <span>Risk Matrix</span>
        </button>
    </footer>

    <!-- Initialize Lucide Vector Icons and UI Core System Script -->
    <script src="prev/app.js"></script>
</body>
</html>
