<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Playbook Workspace | BANKBUGS</title>
    <!-- Hard-Locked Session Guard: Blocks unauthorized direct URL hits -->
    <script>
        (() => {
            const sessionToken = sessionStorage.getItem("ecosystem_session_state");
            if (sessionToken !== "authorized") {
                window.location.replace("login.html");
            }
        })();
    </script>
    <!-- File Linking Requirements -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- 1. LOCKED TOP NAVIGATION -->
    <header class="top-nav">
        <div class="nav-brand">
            <span class="logo-text">BANKBUGS</span>
            <span class="logo-badge">WORKSPACE</span>
        </div>
        
        <nav class="nav-tabs-wrapper">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Playbook</a>
            <a href="#" class="nav-link">Journal</a>
        </nav>

        <div class="nav-profile-zone">
            <span id="active-user-badge" class="user-badge">Trader</span>
            <button type="button" id="logout-btn" class="logout-link">Disconnect</button>
        </div>
    </header>

    <!-- Master Layout Body Wrapper (Houses Sidebar and Main Content) -->
    <div class="app-layout-body">
        
        <!-- 2. COLLAPSIBLE SIDEBAR MENU -->
        <aside id="sidebar" class="sidebar-open">
            <div class="sidebar-controls">
                <button type="button" id="sidebar-toggle" aria-label="Toggle Menu">
                    <span class="toggle-icon"></span>
                </button>
            </div>
            
            <nav class="sidebar-strategy-menu">
                <span class="menu-heading">Strategies</span>
                <!-- Placeholder vertical list for strategy selection items -->
                <div class="strategy-list-placeholders">
                    <div class="strategy-placeholder-item active"></div>
                    <div class="strategy-placeholder-item"></div>
                    <div class="strategy-placeholder-item"></div>
                </div>
            </nav>
        </aside>

        <!-- 3. MAIN CONTENT VIEWPORT -->
        <main class="content-viewport">
            <!-- Future playbook dashboards and modules will be injected here -->
            <div class="page-content">
                <!-- Content Injector Placeholder Boundary Box -->
            </div>
        </main>
        
    </div>

    <!-- 4. LOCKED BOTTOM BAR -->
    <footer class="bottom-nav">
        <div class="status-indicator-group">
            <span class="status-pulse-dot"></span>
            <span class="status-text">System Operational</span>
        </div>
        <div class="metric-snapshots-placeholder">
            <span class="metric-label">Feed Latency:</span>
            <span class="metric-value">12ms</span>
        </div>
    </footer>

    <!-- Existing Script File Linking Requirement -->
    <script src="js/dashboard.js"></script>
</body>
</html>
